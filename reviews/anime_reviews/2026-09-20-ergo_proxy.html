                    <h2><em>Ergo Proxy</em> review</h2>

                <script>
                    const textParagraphs = [
                        `Ergo Proxy is one of those shows that reminds me of why I like anime in the first place. Sure, anime can be colorful, fun, youthful; yet, what has drawn me to the medium is the unicity of it. You simply do not find, in the West, animation being used quite as boldly and inventively as it is in Japan.`,

                        `The more I read about it, the more I am surprised Ergo Proxy even happened; how did something so genre-bending, so cryptic, so unconventional way, ever get the green light, and for a full 23-episode season to boot? Count your blessings.`,

                        `Ergo Proxy is cyberpunk, except not really, not at all. I mean, where are my cyborgs and my evil megacorporations? High tech and low life? It is not even science fiction; the best way I can think of to encapsulate it is that it is a strange kind of metaphysical road trip. Sure, the protagonists to inhabit "real places" and they end up in a dream only a couple of times, but I do question the idea that there is anything really real in Ergo Proxy's world.`,

                        `Okay, let me give a try at explaining the setting. It is many years into the future; a terrible ecological disaster has happened at an undefined moment in the past, and now humanity is reduced to a number of domed cities surrounded by the desert of a scorched planet. The show's events open up in the domed city of Romdo, where we are acquainted with one of the show's protagonists, the elegant Re-l Mayer, the granddaughter of the city's Regent, who, working for the Citizen Intelligence Bureau, is tasked with investigating the mysterious outbreak of the so-called Cogito virus, which causes all AutoReivs it infects to become self-aware and go rogue. Oh, AutoReivs are basically androids, produced to assist the inhabitants of Romdo in their daily life. Re-l is accompanied by one—Iggy—and one of the story's central protagonists also happens to be one. More on that later.`,

                        `Well, so far so good, right? Seems like a science fiction plot through and through, with a sprinkling of police procedural drama. A creative one to be sure, but still familiar territory.`,

                        `Think again.`,

                        `It does not take long for Ergo Proxy to shed any pretense of being a conventional post-apocalyptic science fiction story. We already get a hint of stranger things to come when a shadowy monster called a Proxy stalks and attacks her in her apartment; in another part of the city, the meek and unassuming Vincent Law, another of the show's protagonists, starts being chased by a monster himself. Ah yes, Vincent Law, allegedly an immigrant from a ruined dome, who wants nothing but to do the menial work he is tasked with in order to someday be granted citizenship. Gee, why would this guy of all people be tormented like this?`,

                        `Incidentally, it is during Vincent Law's desperate attempts to dodge his fate—the authorities are now keen on laying their hands on him, too—that the third and final main character is introduced: Pino, a companion AutoReiv resembling a little girl who gained self-awareness without anyone ever noticing. Ironic how she is one of the most human characters in the entire series. As for Re-l? She is irresistibly drawn to Vincent Law for reasons she herself cannot fully comprehend, other than her being utterly fed up with Romdo's perfectly orderly, and perfectly boring, way of life.`,

                        `Soon enough, Vincent Law finds no other way to escape than to flee the dome itself. So much for his dreams of model citizenship, right?`,

                        `After a brief stint at a kind of commune, feeding off from the scraps dumped from the dome, Vincent and Pino embark on a journey across the barren landscape. Sometime after, they are joined by Re-l as well. It is here that the mask finally drops; what follows after is a crescendo of ever greater, and more inexplicable, strangeness. You have to wonder if the world was ever normal to begin with.`,

                        `Now, do not misunderstand me; Ergo Proxy is not something like, say, Yume Nikki; it is not a literal fever dream, but it is a story, and a setting, that refuses to be fit in a hole, be it square or round. You can make sense of the story, but only if you learn to embrace its logic. Each dome the trio visits is more inexplicable than the last; each new bit of information uncovered about the Proxies, and about Vincent's and, it turns out, Re-l's relation to them serves only to increase your wonder; the final, climactic showdown in the crumbling city of Romdo, whose illusion of order has been completely shattered, seems to solve a single plot line but leaves another one wide agape. What is this world? What did humanity even do? Did they actually create the Proxy? How? Where were they during all this time? What is going to happen now that they have returned?`,

                        `Personally, I do not really care. I am just glad Re-l, Vincent Law, and Pino are reunited by the end, and that their journey is destined to continue, though we will never hear from them again.`
                    ];
