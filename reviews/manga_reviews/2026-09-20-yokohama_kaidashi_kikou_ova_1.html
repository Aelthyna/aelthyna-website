                <script>
                    const textParagraphs = [
                        `<em>The festival-like world has slowly settled to a leisurely pace.</em>`,

                        `<em>The dangerous times have since been called "The Age of Evening Calm."</em>`,

                        `I have decided to open up my review with a few quotes from the anime. I think they are really expressive, and pin down precisely what it is that makes the world of Yokohama Kaidashi Kikou so special.`,

                        `For me, Yokohama Kaidashi Kikou has been a genuine life-changing experience, though in an inner sense: I read the manga during my formative years, which led it to fundamentally shape my taste, and yes, my worldview.`,

                        `To this day, I still find the premise of Yokohama Kaidashi Kikou to be as resonant as ever. A dying world, akin to a weakly flickering candle on the edge of exhaustion, where something inexplicable has happened that has made the further existence of human life impossible. Yet, Yokohama Kaidashi Kikou's apocalyptic setting is the gentlest one you can imagine: there is no sign of tragedy, of death, or of suffering in general, other than a quiet wistfulness humming in the background. Human civilization is slowly fading out, yet those who remain seem to have grown accustomed to this new kind of twilight life. Life goes on as normal, just inexorably decelerating to a final stop.`,

                        `The protagonist, Alpha, is an android. She is, counterintuitively, the most humane character in the story. I always liked to read her as a kind of "witness" for humanity's existence; when the latter will have faded out, she, and others like her, will remain to tell the story.`,

                        `Still, this is a review of the 1998 OVA. The best way to describe it is as a sampling, a foretaste for getting into the manga proper, or perhaps a side dish during or after your reading of it. It is just two episodes long, but it can really be considered a kind of one-hour long short movie.`,

                        `I think the OVA does an exceptional job at transmitting the kind of experience Yokohama Kaidashi Kikou has to offer. Not that you need that many episodes, or that many words; the premise is simple, and there is no real storyline; it is, at its core, just a mood, a state of mind, which a few short scenes can communicate well enough.`,

                        `There are two other things that really stayed with me. First, the background scenery. The peaceful world of Yokohama Kaidashi Kikou, filtered through the texture of cel animation, produces an effect that I find intensely bittersweet and evocative. Lastly, the soundtrack is incredible; I just do not have the words to describe it. It is so happy and cheerful, so innocent, so bright and yet characteristically nostalgic. Please, absolutely give it a listen. "Kaze ga fuite ita" in particular remains etched in my mind after all these years.`,

                        `<em>I will probably keep watching this twilight world as long as time flows. […] To think that an era would reach its twilight so pleasantly.</em>`
                    ];
