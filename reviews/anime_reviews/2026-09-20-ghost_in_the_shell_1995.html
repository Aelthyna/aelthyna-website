                <script>
                    const textParagraphs = [
                        `Let us get one thing out of the way: I love Ghost in the Shell. A lot. To this day, I consider Mamoru Oshii's first adaptation of Masamune Shirow's iconic franchise as the best kind of cyberpunk there is; yes, even better than Blade Runner.`,

                        `As for why, I would say it is two aspects in particular: the marvelous mood of this movie, and its thematic purity.`,

                        `When it comes to the first aspect, Ghost in the Shell feels atmospheric to a level few other anime can match. Sure, the police procedural parts of it are sleek enough, but those are just the surface; the real core is in its deeply haunting, ethereal presence. Take the movie's score alone, a combination of synths and traditional Japanese choral chants, which animates all of the story's more contemplative scenes. When listening to it, I never fail to feel a chill running down my spine; it feels like the hyper-technological, impersonal world of Ghost in the Shell taking on a life of its own, the chants the voice of its soul. Yet, even this marvelous music would not be enough were it not complemented by the masterful artistic direction of the movie; lovingly detailed, painterly backgrounds, painstaking animation, harrowing action sequences, soulful contemplative moments.`,

                        `A particular highlight is, unquestionably, the scene where the Major rides on a boat along one of the city's old canals. This section represents, to my eyes, the best example of how the movie can combine its spectral music with its evocative animation to great effect; as the viewer, you almost feel like you are experiencing the Major's alienation yourself. The moment when the Major spots, in a nearby restaurant, a person with exactly her resemblance feels especially eerie, and always leaves me a little dazed.`,

                        `As for the second aspect, it does not get any more cyberpunk than Ghost in the Shell. Well, and Snow Crash, but this review is not about the latter. Cyberpunk is more than just an aesthetic, more than just a fancy neon-lit technological dystopia; cyberpunk is an exploration of runaway information technology growing too big for its creators to understand, for better and for worse, taking on its own momentum, developing a life of its own, substituting undirected, unconscious biological evolution for self-aware, efficient technological evolution. Human beings have two choices left: accept their own obsolescence, or merge with the machine. This is precisely what Ghost in the Shell laser focuses on, and I love it for that.`,

                        `The Major is not just a terrific soldier, but she is also the kind of person best suited to intimately perceive this change. Though she is cyberized to the furthest extent possible, she is hardly alone in that; so is Batou, for that matter. What makes her unique is her profound sense of alienation from her own existence; she is markedly aware of how little still tethers her to natural life. Unsurprisingly, then, when Project 2501 finally announces its existence as the first sentient life to have developed completely spontaneously in the infinite complexity of the digital network, she is immediately drawn by it; why, she herself does not know. She just feels there is a connection between her state of being and this new possibility that has opened up to her.`,

                        `The movie ends with one of the purest examples of technological singularity I have seen yet. Ghost in the Shell features a lot of themes—you could fill out more than one essay about those—but its most brilliant accomplishment is showing, in the starkest of terms, how humanity, and biological life in general, have reached their own deadline, having inaugurated with its own hands the next step of the evolution of the universe. The dystopian setting is just a temporary state; with the merger of biological and synthetic intelligence, nothing will ever be the same again.`
                    ];
