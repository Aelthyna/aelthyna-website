                <script>
                    const textParagraphs = [
                        `Disclaimer: I am really fond of Planetes. Why? Because it is so normal. No, really.`,

                        `Anime, and fiction in general, are just so full of the strangest of stories, and why not? We already know what real life is like, why not leverage the power of fiction to explore something we cannot experience ourselves?`,

                        `Fair enough; yet sometimes, it feels good for fiction to serve as a window in our own lived-in experience.`,

                        `Planetes is part hard science speculative fiction, part mundane workplace drama. Set in the late 21st century, it depicts a world very much like ours, only a little ahead in the future: Earth is still what we love and hate, with its old-fashioned squabbling nation states, the United Nations trying to keep us together, and ordinary people just getting by.`,

                        `Just a difference, though: space exploration has done pretty well for itself. We have now established large human settlements on the Moon and Mars, space travel has become (fairly) affordable, satellites and space stations big and small populate our planet's orbit. As of the time of writing this, I am a bit envious: I wish our own efforts were proceeding quite as rapidly!`,

                        `Of course, all that space activity is bound to produce some refuse. It is bad enough on the surface of the Earth, it is worse in space; even the smallest bit of debris at a high enough orbital speed can be quite the problem. Enter the Toy Box and its crew, one of the many teams tasked with keeping space viable for human activity. The garbage men of the Space Age, really (though, in such a context, the skill involved is no mean task, rest assured of that).`,

                        `Fee, the Toy Box's pilot and team leader, and EVA suit operators Yuri, Hachimaki, and Tanabe form the Toy Box's crew and the story's central cast of characters. Each of them is quite the ordinary type, only not in the boring sense of the word: ordinary because that is real human life, extraordinary because we are all unique in our own way. Fee is confident, pragmatic, and deeply responsible for her crew's safety; Yuri is the quiet, pensive type, outwardly calm yet harboring something unspoken in his heart; Hachimaki is bold and brash, though that might have something to do with his frustrated ambitions; Tanabe is cheerful and optimistic (though not superficial!) as a sunbeam.`,

                        `Planetes' mosaic of everyday characters is wider than that, however: Hachimaki's father Goro, a talented engineer with an irresponsible (and sometimes lewd) personality, Werner Locksmith, the brilliant lead engineer of the Von Braun who has seemingly traded his empathy for his scientific endeavors, Nono, one of the first human beings born on the moon. It would be senseless to list them all.`,

                        `Planetes does not really have an overarching plot; real life does not, either. The story alternates between chapters of daily drama, sometimes comedic sometimes sad and always relatable, and chapters of high-stakes events that the characters serendipitously find themselves in, be it a terrorist plot, geopolitical conflicts in space, and a historic mission to Jupiter. There remains a common red thread, however, and that is a reflection on human life; not one meant to uncover any great truths, but rather just remind us of how rich the tapestry of real life already is.`
                    ];
