                    <h2><em>Battle Angel Alita</em> (manga) review</h2>
                    <a href="../manga_reviews.html" class="back-button">(Return to Previous Page)</a>
                </div>

                <section id="text-pages"></section>

                <script>
                    const textParagraphs = [
                        `Battle Angel Alita is widely considered a cyberpunk classic, although to my eyes it is much closer to titles like Fallout or Mad Max than Blade Runner or Ghost in the Shell. Granted, cyberpunk is a word that is used very loosely, often referring mostly to an aesthetic, or a mood; dystopian technological futures, body modification, computer technology, malevolent corporations, technical progress accompanied by social decay. As I see it, however, Battle Angel Alita is biopunk through and through: the focus of dystopia is biotechnology rather than information technology, which is, in fact, nearly absent in Alita's universe.`,

                        `Still, the point of this review is not to argue semantics, but rather to talk about the manga itself, not to mention Alita, the titular heroine of the story.`,

                        `As I see it, there are two sides to Battle Angel Alita.`,

                        `The first one, and the most apparent one, is that of a gritty post-apocalyptic story in the vein of Mad Max, only the collapse of humanity has engulfed the entire colonized Solar System. The Scrapyard, the main setting for much of the story, feels like it could have at home in an '80s action movie; body horror is a recurring theme, as exemplified by many of the characters in the manga who have been disfigured by crude body augmentations or who have had their bodies extensively modified in other ways (a certain mad scientist might have played a part in some of that…).`,

                        `The other side, the one that personally hit home the most, is Alita herself. Let us be honest: Battle Angel Alita's universe is horrid. Yes, it is inventive and fascinating, yet also unsettling and revolting, albeit in a captivating way: my impression is that of a world where humanity has thoroughly and utterly failed. Gross, disfiguring body modifications, complete social decay, cruelty and suffering, a desensitization to violence. The Scrapyard is a horrid place to live in, and yet it is arguably not even the worst place out there; the false utopia of Zalem might be an ever worse place. At least you get to keep your brain in the Scrapyard.`,

                        `As I said: it's a Mad Max world. Not something I am too keen about. Thank God for Alita herself, then, because she really is the angel the manga's Western title makes her out to be. A cyborg whose only remnants of her once natural life is a tiny portion of her biological brain, she is found by Ido, a cyber doctor (that is, a doctor specializing in cyborgs), as nothing but a battered, seemingly lifeless torso in the scrap heap formed by the refuse streaming down from Zalem.`,

                        `An unassuming start, is it not? Yet, it soon becomes apparent that there is a very real emotional core underneath the coarse and rough exterior of the manga. To put it simply, Alita is a beautiful person, and so is Ido. Ido, numbed down by his daily job of treating dehumanized combinations of man and machine, and by his moonlighting as a freelance bounty hunter against rogue denizens of the Scrapyard, is a person who strongly feels the need for something pure, uncorrupted, innocent in his life: it is with this purpose that he saves the remnants of Alita, patching her up and giving her a new lease on life.`,

                        `Though Alita's past is hardly an idyllic one, the new version of her quickly grows to be a gentle, loving person under Ido's affectionate care. She is, however, quite the strong-willed and idealistic person: suffice it to say that, once she discovers her caretaker's nightly errands as a bounty hunter (and bounty hunters in Alita's universe never ask questions and kill in the most gruesome ways imaginable), she feels it her duty to become a bounty huntress herself to repay her debt.`,

                        `Yet, Alita's personal drive is even stronger than that—oh-so stronger. The catalyst for her personal development is her youthful love for Hugo, a young teenaged boy whom she discovers by change at the outskirts of the Scrapyard. Hugo's dream, bless his heart, is to put aside enough money for a one-way ticket to Zalem. He is a little impatient, though, so he goes about it in a somewhat questionable way: with the help of some friends, he lures cyborgs into a trap by offering to lubricate their joints; in doing so, he paralyzes them and steals their spinal cords—quite the valuable commodity in the Scrapyard's shadow economy. Inexcusable as that might be, I could not help but feel a little bit of sympathy for him: the sudden loss of his family, and the savagery of the Scrapyard could hardly be expected not to leave an impact on him. In spite of all that, there is a real tinge of innocence in him, and that is what Alita unwittingly ended up falling in love with. That is, until Hugo's actions are discovered by Zapan, a bitter and broken man bent on a personal revenge against Alita. Hugo's harrowing demise breaks Alita in a way she had never experienced before; this is the moment when she strikes out on her journey, a quest for self-discovery that will occupy much of the rest of the manga.`,

                        `Alita is simply impossibly special; what it is in her heart that drives her so strongly I could never quite understand. While the franchise later expanded on the state of the rest of the Solar System, turning the story into a genuine space opera with Alita an almost messianic figure, the original manga wisely limits itself to detailing how Alita came to realize the full extent of her potential. I have my own interpretation about it: the sheer failure of the human species, as evidenced by the complete absence of any kind of even remotely humane society, is so deep that no human being can amend it. It takes a person that is more machine than woman, a new kind of life, driven by the fiery passion of her previous life as a fierce Martian warrior, but also by the knowledge of the real love that can still be found in people's hearts, to give the world a chance to heal itself.`
