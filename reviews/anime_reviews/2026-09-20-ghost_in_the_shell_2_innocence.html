                    <h2><em>Ghost in the Shell 2: Innocence</em> review</h2>

                <script>
                    const textParagraphs = [
                        `Ghost in the Shell 2: Innocence is quite the tonal whiplash in more ways than one. As with most other people, I have come to this movie after watching the original, and, even after repeated viewings, I could never quite bring myself to like it. It was simply too different in a way I could not come to terms with.`,

                        `Yet, over the years, something changed, almost as if I had discovered the secret of how to approach this movie. Today, I see it as brilliant, although clearly not as iconic as its predecessor.`,

                        `Innocence's narrative is part continuation of the first movie, part standalone.`,

                        `The events of its predecessor have direct bearing on its story: the Major is gone, having merged with Project 2501, and Batou, albeit still as tough and professional as ever, is left deeply shaken by the event. The relationship between him and the Major was always a little lopsided: while Batou was arguably the Major's closest friend, Batou felt something perhaps even more intense than that; I like to see it as a kind of platonic love. With the Major's disappearance, Batou plunges in a state of loneliness he is unable to recover from.`,

                        `The Major's lingering presence is, however, the only connection to the first movie; the rest of Innocence's story is standalone. What it revolves around is quite simple: a string of murders committed by gynoids—female androids—of their own owners, after which the gynoids would kill themselves. To make matters even stranger, forensic analysis uncovers what seem to be traces of a ghost in each terminated gynoid.`,

                        `Batou partners up with Togusa, who has now climbed ranks to become his personal sidekick; the two are tasked with investigating the murders.`,

                        `It turns out the gynoids all belonged to the same limited production run of female companion androids manufactured by a company called Locus Solus. In their search for the people responsible, Batou and Togusa find themselves in the lawless frontier of Etorofu, where they find out Locus Solus' secret headquarters and production facility are in a ship floating in international waters. What they find there sheds light on the gynoids' going rogue in a way they could have never predicted.`,

                        `It is in that moment when the meaning of the movie's subtitle is explained. The innocence referred to is that of dolls; the gynoids, in the context of the story. Their innocence stems from the fact that they have no soul, or ghost; while it is the latter that endows a human being with self-awareness, the price to be paid is the permanent loss of the obliviousness of an unconscious thing—the loss of innocence. The gynoids' murder spree seems, then, to have been the cry of beings in which a ghost was forced, forcefully depriving them of their own innocence.`,

                        `Much has been said about Innocence's heavy-handed quotations and frequent philosophizing, and yes, that can be a problem. None of it is random—it all has a direct connection to the events at hand—though it can feel jarring to a viewer who is used to the minimalism of the 1995 movie. I see it, if nothing else, as part of the "texture" of the movie, a texture that I can best describe as hazy and dreamy. Nothing feels quite like reality; the golden tones, the classic cars, the exchanges of quotations, the mystic spires of Etorofu, always felt to me like the real world transfigured through Batou's sense of loss. You could argue that Innocence is, aside from its philosophical undertones, also something of a love story.`
                    ];
