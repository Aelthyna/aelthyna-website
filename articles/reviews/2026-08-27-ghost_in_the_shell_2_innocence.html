                    <h2>A review of Mamoru Oshii's <em>Ghost in the Shell 2: Innocence</em></h2>
                    <a href="../reviews.html" class="back-button">(Return to Previous Page)</a>
                </div>

                <section id="text-pages"></section>
                <div id="text-pagination"></div>

                <script>
                    const textParagraphs = [
                        `Innocence is the second Ghost in the Shell film directed by the legendary director Mamoru Oshii. As such, it is meant to be a direct sequel to the events depicted in the first film; furthermore, whereas the former was based on a story (that of the Puppeteer) featured in the first manga, Innocence is an entirely original development.`,

                        `The narrative picks up from what last transpired by the end of the original film: Major Kusanagi willingly merging her consciousness with that of the Puppeteer, a rogue AI—Project 2501—that has gained awareness of itself. In doing so, the Major transformed into a purely digital entity, freed from the constraints of her physical body.`,

                        `Batou, who always harbored a deep attachment to the Major, is deeply struck by this development. Though he tries his best to keep Motoko on "this side" of reality, he ultimately accepts her decision; nevertheless, a wound is created in his soul that he is not able to mend.`,

                        `Anyone who has ever watched Innocence has undoubtedly noticed how different the film is from its predecessor in its depiction of reality. The first Ghost in the Shell, though a deeply contemplative film, was also strongly grounded in the reality of its universe; its stark, cold setting mirrored the ever more pervasive presence of technology in the human world, to the detriment of the latter. Innocence, on the other hand, features a warmer color scheme, predominated by shades of gold; it almost feels like an old film, a sensation strengthened by the characters driving classic cars from the Fifties. This difference is perhaps best explained by arguing that Innocence makes the viewer see the world not through an objective lens, but through that of Batou himself; mired in his loneliness, his world transforms into something of a hazy dream, fueled by longing and nostalgia.`,

                        `It is this emotional state, and Batou's constant attempts to reach out to Motoko, that form the backbone of Innocence's more introspective side, and that can be aptly described as a love story. That is, after all, precisely what the relationship between Batou and Motoko was; though never physical, it was a bond founded on a sense of deep trust on Motoko's side, and of profound attachment on Batou's.`,

                        `The overarching plot of Innocence, however, is based on a detective story through the events of which the love story is interwoven. The catalyst for the narrative's events is a series of gruesome murders caused by malfunctioning gynoids—female companion androids—who, after murdering their owners, invariably end up killing themselves. Batou, having teamed up with Togusa, is tasked with investigating the case; the two of them soon find out that the gynoids are all manufactured by a company known as Locus Solus, which operates in the international waters close to Etorofu Special Economic Zone—a frontier area under ambiguous jurisdiction.`,

                        `When Batou finally infiltrates the facility in which the gynoids are produced—a heavily fortified manufacturing ship—he discovers, with the aid of Motoko, the grim truth behind the androids, the reason of their success yet also the reason for their going rogue: unbeknownst to everyone, Locus Solus, in order to enhance their appeal, endows the gynoids with actual ghosts, obtained through ghost dubbing kidnapped children. Ghost dubbing is a technique that inevitably harms the person on which it is performed, meaning that all kidnapped children eventually turn out dead.`,

                        `This detective story is far from a simple external trapping of the narrative, however, and plays a fundamental part in this film's philosophical ideas. Like its predecessor, Innocence analyzes, albeit from a different perspective, the theme of how human consciousness is affected by the evolution of technology.`,

                        `In Ghost in the Shell, the story concentrated on how the boundaries of the self are increasingly dissolved by an ever more deeply interconnected world, and on the alienation that is felt in a world where the entirety of the human body, other than a thin sliver of the brain, can be manufactured.`,

                        `In Innocence, the focus shifts to the nature of human consciousness itself, as seen through the lens of the puppets.`,

                        `Though the literary foundations are many, there is one that is especially fundamental to understanding Innocence's themes: Heinrich von Kleist's essay "On the Marionette Theatre." In the essay, Kleist argues that there are three levels through which consciousness, or awareness of the self, manifests itself: complete lack of consciousness, partial consciousness, and full consciousness. Puppets are devoid of consciousness, while God is endowed with a full consciousness, that is, omniscience. Both are argued to be perfect: two extremes produce the same result.`,

                        `Puppets, because they are entirely unburdened by any sense of self, can achieve complete grace: when the puppeteer moves them, every movement of the puppet passes entirely through its center of gravity, thereby reaching perfection by being subject to the laws of physics alone.`,

                        `God, because they have infinite knowledge about everything, achieves the same perfection as entirely unconscious beings, only from the opposite direction. God wills each of their actions, and does so with perfect knowledge of its premises and of its consequences. Everything in them makes perfect sense and is in harmony with the entirety of the universe.`,

                        `Human beings, because they possess an imperfect consciousness, find themselves in the middle between puppets and God. Because they possess a partial awareness of their self, they can command all of their actions; however, their imperfect nature manifests itself through their primal instincts, their emotions, their insecurity, and these, in turn, spoil all of their actions. Human beings simply can never reach the same grace and perfection that both puppets and God are capable of; they have lost the innocence of puppets, but have not achieved the totality of God.`,

                        `As such, one of the film's thematic cores, together with that of loss and grief, is really the loss of innocence. What Locus Solus has done with its androids is a terrible two-fold crime: by forcing the ghosts of human beings into their androids, they have harmed both the androids themselves, depriving them of their innocence, but also harmed the children they harvested the ghosts from, as ghost dubbing ultimately kills them.`,

                        `Though Innocence was critically acclaimed on release, it lives in the shadow of its predecessor, and is often criticized by viewers for being obscure and relying excessively on literary quotations. I think this criticism is partly warranted. The first film was able to express great depth mostly through mood and emotion; it entirely embraced the philosophy of showing, not telling. Its sequel, on the other hand, though it remains intensely evocative and moody, does undoubtedly rely heavily on a barrage of references, most of which will probably fall flat on most viewers. However, I feel like the entangled web of references meshes quite well with the structure of the narrative; Innocence has a strong introspective bent, and feels very much like a dream; it is fragmented, disjointed, and never quite real. The literary quotations are meant to form a kind of puzzle that enhances the surreal and dream-like feel of the narrative.`,

                        `All in all, I cannot hesitate to recommend Ghost in the Shell 2, only with a caveat: be willing to accept the departure from the original film, and accept it for what it is. If you do so, you will be rewarded with one of the most accomplished films ever put into anime form.`
